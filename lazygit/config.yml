# Config relating to the Lazygit UI
gui:
  # Default size for focused window. Can be changed from within Lazygit with '+'
  # and '_' (but this won't change the default).
  # One of: 'normal' (default) | 'half' | 'full'
  screenMode: half

  # Window border style.
  # One of 'rounded' (default) | 'single' | 'double' | 'hidden' | 'bold'
  border: single
  nerdFontsVersion: "3"
  theme:
    activeBorderColor:
      - "#c4b28a" # dragon waveRed/dragonGreen accent
      - bold
    inactiveBorderColor:
      - "#54546d" # dragon sumiInk4 (muted border)
    optionsTextColor:
      - "#7e9cd8" # dragon crystalBlue
    selectedLineBgColor:
      - "#2d4f67" # dragon waveBlue2 (selection bg)
    selectedRangeBgColor:
      - "#2d4f67"
    cherryPickedCommitBgColor:
      - "#49443c" # dragon dragonGreen dim
    cherryPickedCommitFgColor:
      - "#c4b28a" # dragon dragonYellow
    unstagedChangesColor:
      - "#c34043" # dragon autumnRed
    defaultFgColor:
      - "#c5c9c5" # dragon fujiWhite

