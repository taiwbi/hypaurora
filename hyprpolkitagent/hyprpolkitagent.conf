# Small Catppuccin-friendly sizing overrides for hyprpolkitagent.
# Authentication itself is owned by hyprpolkitagent.service; do not start a
# second polkit agent such as polkit-mate or lxqt-policykit.

general {
    password_field_width = 360
    window_width = 560
    window_height = 420
    show_details = true
}

