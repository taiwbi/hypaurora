# Ghostty-compatible Kitty configuration.

# --- Fonts ---
# Keep code in JetBrains Mono and route the icon and Arabic/Persian glyphs to
# their purpose-built fonts. The ranges below reflect the glyphs actually
# present in BetterIcons and Vazir Code Hack, so mapped glyphs never become
# missing-glyph boxes.
font_family JetBrains Mono
font_size 13

# BetterIcons (Nerd Fonts fork)
symbol_map U+23FB-U+23FE,U+2630,U+2665,U+26A1,U+276C-U+2771,U+2B58,U+E000-U+E00A,U+E0A0-U+E0A3,U+E0B0-U+E0C8,U+E0CA,U+E0CC-U+E0D2,U+E0D4,U+E0D6-U+E0D7,U+E200-U+E2A9,U+E300-U+E3E3,U+E5FA-U+E6B8,U+E700-U+E8EF,U+EA60-U+EA88,U+EA8A-U+EA8C,U+EA8F-U+EAC7,U+EAC9,U+EACC-U+EB09,U+EB0B-U+EB4E,U+EB50-U+EC1E,U+ED00-U+EFCE,U+F000-U+F381,U+F400-U+F533,U+F0001-U+F1AF0 BetterIcons

# Vazir Code Hack: Persian/Arabic characters, presentation forms, and joiners.
symbol_map U+060C,U+0615,U+061B,U+061F,U+0621-U+063A,U+0640-U+0655,U+0657,U+065A,U+0660-U+0670,U+0674,U+067E,U+0686,U+0698,U+06A1,U+06A9,U+06AF,U+06BA,U+06C0,U+06CA,U+06CC,U+06D5,U+06F0-U+06F9,U+200C-U+200D,U+FB56-U+FB59,U+FB7A-U+FB7D,U+FB8A-U+FB8B,U+FB8E-U+FB95,U+FB9E-U+FB9F,U+FBA5,U+FBAC-U+FBAD,U+FBE8-U+FBE9,U+FBFC-U+FBFF,U+FE70-U+FE74,U+FE76-U+FEF4,U+FEFF Vazir Code Hack

# --- Cell dimensions ---
# Ghostty's `adjust-cell-height = 17` is an additive pixel adjustment.
modify_font cell_height 17px

# --- Window ---
remember_window_size no
initial_window_width 130c
initial_window_height 22c
window_padding_width 10
background_opacity 1
hide_window_decorations yes
# Match Ghostty's `window-theme = ghostty` by tinting the Wayland titlebar
# with the active terminal background instead of the desktop default.
wayland_titlebar_color background

# --- Mouse ---
# A negative wait hides the pointer immediately after typing.
mouse_hide_wait -1

# --- Theme ---
# Kitty loads dark-theme.auto.conf and light-theme.auto.conf from this
# directory when the desktop appearance changes. They contain the customized
# Catppuccin Mocha and Latte palettes from the Ghostty configuration.

# --- Tabs ---
tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style slanted
tab_bar_align left
active_tab_font_style bold
inactive_tab_font_style normal
tab_title_template "{title}"
active_tab_title_template "{title}"

# --- Keybindings ---
map ctrl+shift+equal change_font_size all +1.0
map ctrl+shift+minus change_font_size all -1.0
map ctrl+shift+0     change_font_size all 0

map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5
map alt+6 goto_tab 6
map alt+7 goto_tab 7
map alt+8 goto_tab 8
map alt+9 goto_tab 9
