# --- Fonts ---
font_family Noto Sans Mono
bold_font auto
italic_font auto
bold_italic_font auto
font_size 12

symbol_map U+0600-U+06FF,U+0750-U+077F,U+0870-U+089F,U+08A0-U+08FF,U+FB50-U+FDFF,U+FE70-U+FEFF,U+200C-U+200D Vazir Code Hack
force_ltr no
disable_ligatures never

symbol_map U+E000-U+E00A,U+E0A0-U+E0A3,U+E0B0-U+E0C8,U+E0CA,U+E0CC-U+E0D2,U+E0D4,U+E0D6-U+E0D7 BetterIcons
symbol_map U+E200-U+E2A9,U+E300-U+E3E3,U+E5FA-U+E6B8,U+E700-U+E8EF BetterIcons
symbol_map U+EA60-U+EA88,U+EA8A-U+EA8C,U+EA8F-U+EAC7,U+EAC9,U+EACC-U+EB09,U+EB0B-U+EB4E,U+EB50-U+EC1E BetterIcons
symbol_map U+ED00-U+EFCE,U+F000-U+F381,U+F400-U+F533,U+F0001-U+F1AF0 BetterIcons

modify_font cell_height 14px

remember_window_size no
initial_window_width 120c
initial_window_height 23c
window_padding_width 0 0
background_opacity 1

mouse_hide_wait -1

cursor_shape block
shell_integration no-cursor
wayland_titlebar_color background
macos_titlebar_color background
tab_bar_edge top
tab_bar_min_tabs 2

include dark-theme.auto.conf

map ctrl+shift+t new_tab

map ctrl+shift+equal change_font_size current +1
map ctrl+shift+minus change_font_size current -1
map ctrl+shift+0 change_font_size current 0

map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5
map alt+6 goto_tab 6
map alt+7 goto_tab 7
map alt+8 goto_tab 8
map alt+9 goto_tab 9
