# --- Fonts ---
# BEGIN_KITTY_FONTS
font_family      family="Elephant"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS
font_size        11

# Kitty uses `symbol_map` for fallbacks rather than a flat list.
# Arabic/Persian ranges for AzarMehr:
symbol_map U+0600-U+06FF,U+0750-U+077F,U+08A0-U+08FF,U+FB50-U+FDFF,U+FE70-U+FEFF AzarMehrMonospaced

# --- Cell Dimensions ---
modify_font cell_height +6px

# --- Window ---
remember_window_size  no
initial_window_width  95c
initial_window_height 25c
background_opacity    1.0

hide_window_decorations yes
# tab_bar_style hidden

# Padding: x y
window_padding_width  8 8

# --- Mouse ---
# Hides immediately when typing, disables the idle timer
mouse_hide_wait -1

# --- Keybindings ---

map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5
map alt+6 goto_tab 6
map alt+7 goto_tab 7
map alt+8 goto_tab 8
map alt+9 goto_tab 9
map alt+0 goto_tab 10
