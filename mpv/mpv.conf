# Subtitle settings
sub-font="Noto Sans 11"
sub-font-size=27
sub-margin-y=150
sub-border-size=1

osc = no
border = no # Optional, but recommended

vo=gpu

hr-seek=yes

[1440p-vaapi]
vo=gpu-next
gpu-api=opengl
gpu-context=wayland
hwdec=vaapi
cscale=bilinear
vf=lavfi=[scale_vaapi=w=2560:h=1440:format=p010:mode=hq]

