# Hypaurora Catppuccin Mocha lock screen

general {
    hide_cursor = true
    ignore_empty_input = false
}

background {
    monitor =
    path = screenshot
    color = rgba(17, 17, 27, 1.0)
    blur_passes = 4
    blur_size = 16
    noise = 0.0117
    contrast = 0.89
    brightness = 0.65
    vibrancy = 0.20
    vibrancy_darkness = 0.05
}

input-field {
    monitor =
    size = 360, 62
    outline_thickness = 2
    outer_color = rgb(cba6f7)
    inner_color = rgba(11111bE6)
    font_color = rgb(cdd6f4)
    check_color = rgb(a6e3a1)
    fail_color = rgb(f38ba8)
    capslock_color = rgb(f9e2af)
    placeholder_text = <span foreground="##a6adc8">Password</span>
    fail_text = <span foreground="##f38ba8">$FAIL</span>
    rounding = 14
    dots_size = 0.22
    dots_spacing = 0.28
    dots_center = true
    fade_on_empty = false
    font_family = JetBrains Mono
    position = 0, -90
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    text_align = center
    color = rgb(cdd6f4)
    font_size = 64
    font_family = JetBrains Mono
    position = 0, 175
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date '+%A, %d %B %Y'
    text_align = center
    color = rgb(a6adc8)
    font_size = 18
    font_family = JetBrains Mono
    position = 0, 100
    halign = center
    valign = center
}

label {
    monitor =
    text = <span foreground="##6c7086">Hypaurora • Super+Esc to lock</span>
    text_align = center
    font_size = 12
    font_family = JetBrains Mono
    position = 0, 28
    halign = center
    valign = center
}
