# Hypaurora idle policy. hypridle is started by the packaged systemd user unit.

general {
    lock_cmd = pidof hyprlock || (hyprctl switchxkblayout current 0; hyprlock)
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
    inhibit_sleep = 3
}

listener {
    timeout = 300
    on-timeout = hyprctl switchxkblayout current 0; hyprlock
}

listener {
    timeout = 600
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
