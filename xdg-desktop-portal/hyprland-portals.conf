# Portal routing for the UWSM-managed Hyprland session.
# GNOME remains the preferred backend for GNOME-compatible interfaces; the
# compositor backend owns capture, while Nautilus owns FileChooser.

[preferred]
default=gnome;gtk;
org.freedesktop.impl.portal.FileChooser=nautilus;gtk;
org.freedesktop.impl.portal.ScreenCast=hyprland;
org.freedesktop.impl.portal.Screenshot=hyprland;
org.freedesktop.impl.portal.RemoteDesktop=hyprland;
org.freedesktop.impl.portal.Secret=gnome-keyring;
org.freedesktop.impl.portal.Settings=gnome;gtk;

