# Portal routing for the UWSM-managed Hyprland session.
# GTK is the session-neutral backend for ordinary desktop interfaces. The
# Nautilus portal is selected explicitly for the file chooser.

[preferred]
default=gtk;
org.freedesktop.impl.portal.FileChooser=nautilus;gtk;
org.freedesktop.impl.portal.ScreenCast=hyprland;
org.freedesktop.impl.portal.Screenshot=hyprland;
org.freedesktop.impl.portal.RemoteDesktop=hyprland;
org.freedesktop.impl.portal.GlobalShortcuts=hyprland;
org.freedesktop.impl.portal.InputCapture=hyprland;
org.freedesktop.impl.portal.Secret=gnome-keyring;
org.freedesktop.impl.portal.Settings=gtk;
